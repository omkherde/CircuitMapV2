<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="exprGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect fill="#0f172a" width="320" height="200"/>

  <!-- Brain outline - sagittal view -->
  <path d="M160,30
           C200,30 240,45 255,70
           C270,95 270,120 260,140
           C250,160 230,170 200,175
           C170,180 140,178 115,170
           C90,162 70,145 60,120
           C50,95 55,65 75,50
           C95,35 130,30 160,30Z"
        fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Cerebellum -->
  <path d="M230,145 C250,145 265,155 265,168 C265,178 255,185 235,185 C215,185 200,175 200,165 C200,155 215,145 230,145Z"
        fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Brain stem -->
  <path d="M215,175 Q220,190 215,200 L205,200 Q200,190 205,175Z"
        fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Hippocampus - 98th percentile (brightest) -->
  <ellipse cx="175" cy="125" rx="22" ry="12" fill="#2563eb" opacity="0.95" filter="url(#glow)"/>
  <text x="175" y="128" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="7" font-weight="500">Hippocampus</text>

  <!-- Entorhinal cortex - 94th percentile -->
  <ellipse cx="200" cy="145" rx="16" ry="10" fill="#3b82f6" opacity="0.9"/>
  <text x="200" y="148" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="6">Entorhinal</text>

  <!-- Prefrontal cortex - 87th percentile -->
  <path d="M80,70 C70,85 68,105 75,115 C82,105 90,90 95,75 C90,70 85,68 80,70Z"
        fill="#60a5fa" opacity="0.85"/>
  <text x="82" y="95" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="6">PFC</text>

  <!-- Temporal lobe highlight -->
  <path d="M130,140 C145,145 165,150 175,145 C165,155 145,160 125,155 C115,150 120,142 130,140Z"
        fill="#93c5fd" opacity="0.6"/>

  <!-- Title -->
  <text x="160" y="16" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10" font-weight="600">SUV39H1 Expression</text>

  <!-- Color bar -->
  <rect x="270" y="50" width="8" height="80" fill="url(#exprGradient)" rx="2"/>
  <text x="290" y="55" fill="#64748b" font-family="system-ui" font-size="7">High</text>
  <text x="290" y="130" fill="#64748b" font-family="system-ui" font-size="7">Low</text>

  <!-- Legend -->
  <text x="12" y="190" fill="#64748b" font-family="system-ui" font-size="7">Allen Human Brain Atlas</text>

  <!-- Percentile labels -->
  <g fill="#94a3b8" font-family="system-ui" font-size="6">
    <text x="205" y="125">p98</text>
    <text x="220" y="148">p94</text>
    <text x="60" y="85">p87</text>
  </g>
</svg>
